<style>

    --offwhite:#F6F4F7; --charcoal:#3E4649; --white:#FFFFFF;

  * { box-sizing:border-box; }

  input:focus { outline:none; border-color:var(--navy); }
  .btn {

  .result-meta {

  .meta-value { color:var(--navy); font-size:18px; font-weight:800; margin-top:3px; }
  .result-badge {

  .result-label { font-weight:800; color:var(--navy); margin:22px 0 7px; }
  .secondary-box {

let currentQuestion = 0;
let answers = [];
let userName = "";
let userEmail = "";
let emailCaptured = false;

const quizArea = document.getElementById("quizArea");
const progressBar = document.getElementById("progressBar");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function updateProgress() {
  const pct = Math.round((currentQuestion / QUESTIONS.length) * 100);
  progressBar.style.width = pct + "%";
}

function renderIntro() {
  progressBar.style.width = "0%";
  quizArea.innerHTML = `
    <h1 class="intro-title">Descubra o que pode estar por trás da maneira como você se comunica.</h1>
    <p class="intro-text">
      Responda a 9 situações do dia a dia. No final, você terá uma primeira leitura
      das tendências que podem aparecer nas suas conversas.
    </p>

    <div class="how-to-answer">
      <strong>Como responder</strong>
      <p>
        Em cada pergunta, escolha a alternativa que <strong>mais se aproxima do que costuma acontecer com você</strong>.
      </p>
      <p>
        Não precisa ser exatamente assim em todas as situações. Pense na sua tendência mais frequente.
      </p>
    </div>

    <button class="btn" onclick="startQuiz()">Começar o quiz →</button>
  `;
}

function startQuiz() {
  currentQuestion = 0;
  answers = [];
  renderQuestion();
}

function renderQuestion() {
  updateProgress();
  const q = QUESTIONS[currentQuestion];
  let html = `<h2 class="qtext">${escapeHtml(q.situacao)}</h2>`;
  q.options.forEach((opt, i) => {
    html += `<button class="opt" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(opt[0])}</button>`;
  });
  quizArea.innerHTML = html;
}

function selectAnswer(optionIndex) {
  const q = QUESTIONS[currentQuestion];
  answers.push({
    questionId:q.id,
    movement:q.movement,
    dim:q.options[optionIndex][1],
    optionIndex:optionIndex
  });
  currentQuestion++;

  if (currentQuestion < QUESTIONS.length) {
    renderQuestion();
  } else {
    renderLeadCapture();
  }
}

function renderLeadCapture() {
  progressBar.style.width = "100%";
  quizArea.innerHTML = `
    <div class="email-step">
      <h2>Seu resultado está pronto.</h2>
      <p>
        Você acabou de responder a 9 situações de comunicação.
        Agora vamos mostrar uma primeira leitura das suas respostas.
      </p>

      <label for="nameInput">Nome</label>
      <input type="text" id="nameInput" placeholder="Seu nome" autocomplete="name">

      <label for="emailInput">E-mail</label>
      <input type="email" id="emailInput" placeholder="seu@email.com" autocomplete="email">

      <div class="error-msg hidden" id="emailError">Digite um e-mail válido para continuar.</div>

      <button class="btn" onclick="submitLead()">Ver meu resultado →</button>
      <div class="privacy-note">Usaremos seu e-mail para registrar seu resultado do Mapa da Conversa.</div>
    </div>
  `;
}

function submitLead() {
  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  if (!name) {
    const el = document.getElementById("nameInput");
    el.focus();
    return;
  }
  if (!isValid) {
    document.getElementById("emailError").classList.remove("hidden");
    document.getElementById("emailInput").focus();
    return;
  }

  userName = name;
  userEmail = email;
  emailCaptured = true;
  finishQuiz();
}

function tally() {
  const scores = {
    DEFESA:0, RESGUARDO:0, ATROPELO:0, APROVAÇÃO:0,
    EXPLICAÇÃO:0, COMPETIÇÃO:0, VIAGEM:0
  };
  answers.forEach(a => scores[a.dim]++);
  return scores;
}

function sortedKeys(scores) {
  return Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
}

function getPrimarySecondary(scores) {
  const ordered = sortedKeys(scores);
  const max = scores[ordered[0]];
  const primary = ordered.filter(k => scores[k] === max);
  const secondValue = ordered.find(k => scores[k] < max);
  const secondary = secondValue === undefined ? [] : ordered.filter(k => scores[k] === secondValue);
  return {primary, secondary};
}

function movementForKeys(keys) {
  const counts = { FALAR:0, ESCUTAR:0, INTERAGIR:0 };
  answers.forEach(a => {
    if (keys.includes(a.dim)) counts[a.movement]++;
  });
  const max = Math.max(...Object.values(counts));
  if (max === 0) return {counts, top:[]};
  return {
    counts,
    top:Object.keys(counts).filter(k => counts[k] === max)
  };
}

async function finishQuiz() {
  quizArea.innerHTML = `<div class="loading">Preparando sua primeira leitura...</div>`;

  const scores = tally();
  const {primary, secondary} = getPrimarySecondary(scores);
  const movement = movementForKeys([...primary, ...secondary]);

  // Mantém compatibilidade com a tabela existente do projeto original.
  // O nome é coletado no formulário, mas só o e-mail é enviado porque o
  // schema original do Supabase foi construído com esse campo.
  if (supabaseClient) {
    try {
      await supabaseClient.from("quiz_responses").insert({
        email:userEmail,
        answers:answers,
        scores:scores,
        predominant:primary.join(" + ") + (secondary.length ? " | " + secondary.join(" + ") : "")
      });
    } catch (e) {
      console.error("Erro ao salvar resposta:", e);
    }
  }

  try {
    const emailResponse = await fetch('https://gykonsallbevyoaeiiqt.supabase.co/functions/v1/send-quiz-result', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({
        name: document.getElementById("entrada de nome")?.value.trim() || "você",
        email: userEmail,
        result: primary[0],
        secondary: secondary.join(" + "),
        movement: movement.top.join(" e ")
      })
    }); 
    const emailData = await emailResponse.json();
console.log("Resposta do envio:", emailResponse.status, emailData);
  } catch (e) {
    console.error("Erro ao enviar resultado por e-mail:", e);
  }
  renderResult(primary, secondary, movement.top);
}

function movementLabel(movements) {
  const labels = {
    FALAR:"Falar",
    ESCUTAR:"Escutar",
    INTERAGIR:"Interagir"
  };
  return movements.map(m => "🗣️ ".replace("🗣️ ","") + labels[m]);
}

function renderResult(primary, secondary, movements) {
  const primaryNames = primary.map(k => RESULTS[k].nome);
  const secondaryNames = secondary.map(k => RESULTS[k].nome);

  let movementText = "";
  if (movements.length === 1) {
    movementText = labelsMovement(movements[0]);
  } else {
    movementText = movements.map(labelsMovement).join(" e ");
  }

  const mainKey = primary[0];
  const r = RESULTS[mainKey];

  let html = `
    <div class="result-kicker">UMA PRIMEIRA LEITURA DO SEU MAPA</div>
    <h1 class="result-title">Seu resultado</h1>

    <div class="result-meta">
      <div class="meta-row">
        <div class="meta-label">Principal tendência</div>
        <div class="meta-value">${escapeHtml(primaryNames.join(" + "))}</div>
      </div>
      ${secondary.length ? `
      <div class="meta-row">
        <div class="meta-label">Segunda tendência</div>
        <div class="meta-value">${escapeHtml(secondaryNames.join(" + "))}</div>
      </div>` : ""}
      <div class="meta-row">
        <div class="meta-label">Onde essas tendências mais aparecem</div>
        <div class="meta-value">${escapeHtml(movementText)}</div>
      </div>
    </div>

    <div class="result-badge" style="background:${RESULTS[mainKey].cor || '#01319D'}">${escapeHtml(r.nome)}</div>
    <div class="result-quote">“${escapeHtml(r.conversa)}”</div>

    <div class="result-text">${escapeHtml(r.texto)}</div>

    <div class="result-label">Um primeiro movimento</div>
    <div class="result-text">${escapeHtml(r.movimento)}</div>
  `;

  if (secondary.length) {
    html += `
      <div class="secondary-box">
        <strong>Sobre a sua segunda tendência:</strong>
        ${secondary.length === 1
          ? ` ${escapeHtml(RESULTS[secondary[0]].nome)} também aparece nas suas respostas. No Mapa completo, essa relação é aprofundada em diferentes situações de comunicação.`
          : ` as tendências ${escapeHtml(secondaryNames.join(" e "))} aparecem com a mesma frequência como segunda leitura. No Mapa completo, essa relação é aprofundada em diferentes situações de comunicação.`}
      </div>
    `;
  }

  html += `
    <div class="trust-note">
      Este é um primeiro recorte do seu jeito de se comunicar.
      No Mapa da Conversa completo, suas respostas são analisadas em 18 situações
      para mostrar como suas travas aparecem ao Escutar, Falar e Interagir — e o que
      pode ajudar você a construir conversas mais conscientes.
    </div>
    <a href="https://www.adrianadecastro.com.br/mapa-da-conversa"
       class="btn" style="text-decoration:none;text-align:center;display:block;">
       Quero conhecer meu Mapa da Conversa completo →
    </a>
  `;

  quizArea.innerHTML = html;
}

function labelsMovement(movement) {
  return {
    FALAR:"🗣️ Falar",
    ESCUTAR:"👂 Escutar",
    INTERAGIR:"🤝 Interagir"
  }[movement] || movement;
}

renderIntro();
